server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — React Router is not used, but deep links and refreshes
    # should still resolve to the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache hashed Vite assets aggressively; keep index.html fresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
